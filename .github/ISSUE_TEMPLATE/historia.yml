name: História de usuário
description: Uma história ou item técnico do backlog
title: "US-xx: "
labels: ["historia"]
body:
  - type: input
    id: id
    attributes:
      label: ID no backlog
      description: Como está em docs/04-projeto/backlog.md
      placeholder: US-10 ou H-01
    validations:
      required: true
  - type: textarea
    id: historia
    attributes:
      label: História
      placeholder: Como <perfil>, quero <ação> para <benefício>
    validations:
      required: true
  - type: textarea
    id: aceite
    attributes:
      label: Critérios de aceite
      description: Uma história só entra em ciclo com critério de aceite
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: input
    id: rastreio
    attributes:
      label: Requisitos, regras e casos de teste
      placeholder: RF-12 · RN08 · CT-23, CT-24
  - type: dropdown
    id: parte
    attributes:
      label: Parte
      options:
        - App
        - API
        - App + API
        - Testes
        - Documentação
    validations:
      required: true
  - type: dropdown
    id: pontos
    attributes:
      label: Pontos
      options: ["1", "2", "3", "5", "8", "13"]
    validations:
      required: true
