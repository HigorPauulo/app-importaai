# O §6.3 do Norteador exige defeitos registrados com severidade e acompanhados
# até a correção ou a justificativa formal de não correção.
name: Defeito
description: Algo não funciona como a especificação diz
title: "[defeito]: "
labels: ["defeito"]
body:
  - type: textarea
    id: descricao
    attributes:
      label: O que acontece
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que deveria acontecer
      description: Cite o requisito, a regra ou o caso de teste que foi violado
      placeholder: "CT-15: erro no código, com opção de abrir a existente"
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: severidade
    attributes:
      label: Severidade
      options:
        - Crítica (impede um fluxo principal)
        - Alta (fluxo funciona com erro grave ou dado errado)
        - Média (contornável)
        - Baixa (cosmético)
    validations:
      required: true
  - type: dropdown
    id: parte
    attributes:
      label: Parte
      options:
        - App
        - API
        - App + API
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      placeholder: Aparelho físico Android 14, build de desenvolvimento, commit abc1234
  - type: textarea
    id: evidencia
    attributes:
      label: Evidência
      description: Print, vídeo ou log. Nunca cole token, senha ou dado pessoal
