# Atualizações semanais em PR, no padrão de commit do projeto.
# O bloco de maven (/api) entra junto com a H-02: o Dependabot falha se a pasta
# ainda não existe.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    labels: ["dependencias"]

  # O Expo fixa versões compatíveis por SDK; atualizar a SDK é tarefa à parte
  # (npx expo install --fix), por isso só correções e versões menores aqui.
  - package-ecosystem: npm
    directory: /app
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(app)"
    labels: ["dependencias", "app"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
